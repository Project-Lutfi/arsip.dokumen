<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrasi Nama File & Boks Arsip</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header Judul Utama -->
    <h1 class="text-2xl sm:text-3xl font-extrabold text-center text-slate-900 tracking-tight">
      Integrasi Nama File & Boks Arsip
    </h1>

    <!-- Card 1: Input Arsip Baru -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
      <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">
        Input Arsip Baru
      </h2>

      <form id="formArsip" class="space-y-4">
        <!-- Grid Input 4 Kolom -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Tanggal Dokumen</label>
            <input type="date" id="tglDokumen" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Kode Boks Fisik</label>
            <select id="kodeBoks" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">-- Pilih Boks --</option>
              <option value="FIN-2026-B001">FIN-2026-B001</option>
              <option value="FIN-2026-B002">FIN-2026-B002</option>
              <option value="FIN-2026-B005">FIN-2026-B005</option>
              <option value="HRD-2026-B001">HRD-2026-B001</option>
              <option value="UMM-2026-B001">UMM-2026-B001</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Kategori Dokumen</label>
            <select id="kategoriDokumen" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="KONTRAK">KONTRAK</option>
              <option value="INVOICE">INVOICE</option>
              <option value="LAPORAN">LAPORAN</option>
              <option value="SK">SURAT KEPUTUS (SK)</option>
              <option value="SOP">SOP</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Nama / Subjek Dokumen</label>
            <input type="text" id="namaDokumen" placeholder="Contoh: Budi Santoso" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- Auto Generated Input Field -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Nama File Digital Auto-Generated</label>
          <input type="text" id="namaFileDigital" readonly placeholder="Akan terisi otomatis..." class="w-full px-3.5 py-2.5 bg-slate-100 text-slate-600 border border-slate-200 rounded-lg text-sm font-mono outline-none">
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" id="btnSubmit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition shadow-sm flex items-center gap-2">
            Simpan Data Arsip
          </button>
        </div>
      </form>
    </div>

    <!-- Card 2: Daftar Arsip & Lokasi Boks Fisik -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-5">
      <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">
        Daftar Arsip & Lokasi Boks Fisik
      </h2>

      <!-- Search Input -->
      <div>
        <input type="text" id="searchInput" placeholder="Cari nama file, kode boks, atau nama dokumen..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Data Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs sm:text-sm">
          <thead>
            <tr class="border-b border-slate-200 text-slate-700 font-bold">
              <th class="py-3 px-3">Nama File Digital (Sistem)</th>
              <th class="py-3 px-3">Kode Boks Fisik</th>
              <th class="py-3 px-3">Nama Dokumen</th>
              <th class="py-3 px-3">Kategori</th>
              <th class="py-3 px-3">Tgl Dokumen</th>
              <th class="py-3 px-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 text-slate-700">
            <!-- Rendered Rows -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Modal Preview Detail -->
  <div id="modalDetail" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-base">Detail & Preview Arsip</h3>
        <button id="closeModal" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modalContent" class="space-y-3 text-xs sm:text-sm text-slate-700">
        <!-- Dynamic Content -->
      </div>
      <div class="pt-3 border-t text-right">
        <button id="btnCloseModal" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700 transition">
          Tutup
        </button>
      </div>
    </div>
  </div>

  <script>
    // Config Supabase
    const { createClient } = supabase;
    const supabaseUrl = 'https://YOUR_SUPABASE_URL.supabase.co'; 
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY'; 
    const supabaseDb = (supabaseUrl.includes('YOUR_SUPABASE_URL')) ? null : createClient(supabaseUrl, supabaseKey);

    // Elements
    const form = document.getElementById('formArsip');
    const tglInput = document.getElementById('tglDokumen');
    const boksInput = document.getElementById('kodeBoks');
    const kategoriInput = document.getElementById('kategoriDokumen');
    const namaInput = document.getElementById('namaDokumen');
    const autoGenInput = document.getElementById('namaFileDigital');
    const searchInput = document.getElementById('searchInput');
    const tableBody = document.getElementById('tableBody');

    // Initial Default Data (Sesuai Contoh Gambar)
    let dokumenList = JSON.parse(localStorage.getItem('arsip_dokumen_data')) || [
      {
        id: '1',
        nama_file: '20260918_FIN-2026-B005_INVOICE_IPL2609181-001.pdf',
        kode_boks: 'FIN-2026-B005',
        nama_dokumen: 'IPL2609181-001',
        kategori: 'INVOICE',
        tanggal: '2026-09-18'
      }
    ];

    // Generator Nama File Otomatis
    function updateAutoGeneratedName() {
      const tgl = tglInput.value ? tglInput.value.replace(/-/g, '') : 'YYYYMMDD';
      const boks = boksInput.value ? boksInput.value.trim().toUpperCase() : 'BOKS';
      const kat = kategoriInput.value ? kategoriInput.value.trim().toUpperCase() : 'KATEGORI';
      const nama = namaInput.value ? namaInput.value.trim().toUpperCase().replace(/\s+/g, '_') : 'NAMA_SUBJEK';
      
      autoGenInput.value = `${tgl}_${boks}_${kat}_${nama}.pdf`;
    }

    [tglInput, boksInput, kategoriInput, namaInput].forEach(el => {
      el.addEventListener('input', updateAutoGeneratedName);
      el.addEventListener('change', updateAutoGeneratedName);
    });

    // Fetch Data dari Supabase / LocalStorage
    async function fetchDokumen() {
      if (supabaseDb) {
        const { data, error } = await supabaseDb
          .from('dokumen')
          .select('*')
          .order('created_at', { ascending: false });

        if (!error && data) {
          dokumenList = data;
        }
      }
      renderTable(dokumenList);
    }

    // Render Tabel
    function renderTable(data = []) {
      const filterText = searchInput.value.toLowerCase();
      const filteredData = data.filter(item => 
        (item.nama_file || '').toLowerCase().includes(filterText) ||
        (item.kode_boks || '').toLowerCase().includes(filterText) ||
        (item.nama_dokumen || '').toLowerCase().includes(filterText) ||
        (item.kategori || '').toLowerCase().includes(filterText)
      );

      if (filteredData.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="py-8 text-center text-slate-400 text-xs">
              Tidak ada data dokumen ditemukan.
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = filteredData.map(item => `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-3 px-3">
            <span class="inline-block bg-slate-100 text-slate-800 font-mono text-[11px] px-2 py-1 rounded border border-slate-200">
              ${item.nama_file || item.file_digital || '-'}
            </span>
          </td>
          <td class="py-3 px-3">
            <span class="inline-block bg-blue-50 text-blue-700 font-semibold text-[11px] px-2.5 py-1 rounded border border-blue-100">
              ${item.kode_boks || '-'}
            </span>
          </td>
          <td class="py-3 px-3 font-medium text-slate-800">${item.nama_dokumen || '-'}</td>
          <td class="py-3 px-3 text-slate-600">${item.kategori || '-'}</td>
          <td class="py-3 px-3 text-slate-600 whitespace-nowrap">${item.tanggal || '-'}</td>
          <td class="py-3 px-3 text-center">
            <div class="flex items-center justify-center space-x-2">
              <button onclick="openDetail('${item.id}')" title="Preview" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-md transition">
                <i class="fa-regular fa-eye"></i>
              </button>
              <button onclick="deleteDokumen('${item.id}')" title="Hapus" class="p-1.5 text-red-600 hover:bg-red-50 rounded-md transition">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Submit Form (Tambah Data)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newDoc = {
        id: Date.now().toString(),
        tanggal: tglInput.value,
        kode_boks: boksInput.value,
        kategori: kategoriInput.value,
        nama_dokumen: namaInput.value,
        nama_file: autoGenInput.value,
        created_at: new Date().toISOString()
      };

      if (supabaseDb) {
        const { error } = await supabaseDb.from('dokumen').insert([newDoc]);
        if (error) {
          alert('Gagal menyimpan ke Supabase! Menyimpan ke penyimpanan lokal.');
          saveLocal(newDoc);
        } else {
          fetchDokumen();
        }
      } else {
        saveLocal(newDoc);
      }

      form.reset();
      autoGenInput.value = '';
    });

    function saveLocal(item) {
      dokumenList.unshift(item);
      localStorage.setItem('arsip_dokumen_data', JSON.stringify(dokumenList));
      renderTable(dokumenList);
    }

    // Delete Dokumen
    window.deleteDokumen = async function(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus data dokumen ini?')) return;

      if (supabaseDb) {
        await supabaseDb.from('dokumen').delete().eq('id', id);
      }
      
      dokumenList = dokumenList.filter(d => String(d.id) !== String(id));
      localStorage.setItem('arsip_dokumen_data', JSON.stringify(dokumenList));
      renderTable(dokumenList);
    };

    // Modal Handle & Preview
    const modal = document.getElementById('modalDetail');
    const modalContent = document.getElementById('modalContent');

    window.openDetail = function(id) {
      const doc = dokumenList.find(d => String(d.id) === String(id));
      if (!doc) return;

      modalContent.innerHTML = `
        <div class="bg-slate-50 p-4 rounded-lg space-y-2 border border-slate-200">
          <div><span class="text-slate-400">Subjek Dokumen:</span> <strong class="block text-slate-800 text-sm mt-0.5">${doc.nama_dokumen}</strong></div>
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200">
            <div><span class="text-slate-400">Kode Boks:</span> <span class="block font-bold text-blue-600">${doc.kode_boks}</span></div>
            <div><span class="text-slate-400">Kategori:</span> <span class="block font-semibold text-slate-700">${doc.kategori}</span></div>
          </div>
          <div class="pt-2 border-t border-slate-200"><span class="text-slate-400">Tanggal Dokumen:</span> <span class="block text-slate-700">${doc.tanggal}</span></div>
          <div class="pt-2 border-t border-slate-200">
            <span class="text-slate-400">Nama File Digital Auto-Generated:</span> 
            <div class="font-mono text-xs text-slate-800 bg-white p-2 rounded border border-slate-200 mt-1 break-all">${doc.nama_file || doc.file_digital}</div>
          </div>
        </div>
      `;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    [document.getElementById('closeModal'), document.getElementById('btnCloseModal')].forEach(btn => {
      btn.addEventListener('click', () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });
    });

    searchInput.addEventListener('input', () => renderTable(dokumenList));

    // Load Data awal
    fetchDokumen();
  </script>
</body>
</html>
